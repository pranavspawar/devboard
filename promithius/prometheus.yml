global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.

alerting:
  alertmanagers:
    - static_configs:
        - targets:

rule_files:

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          app: "node-exporter"


  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
    scrape_native_histograms: true
  
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: cadvisor-data
     

# Node Exporter target: node-exporter:9100
#
# node-exporter is the Docker Compose service name.
# Node Exporter and Prometheus are running in different containers,
# but both containers are connected to the same "monitoring" network.
# Docker's internal DNS resolves the hostname "node-exporter"
# to the Node Exporter container.
#
# Therefore Prometheus can access Node Exporter using:
# node-exporter:9100
#
# Prometheus uses localhost:9090 for its own metrics because
# Prometheus is running inside the same container.
#
# Rule:
# Different container → service-name:port
# Same container    → localhost:port      
