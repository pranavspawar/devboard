apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: devboard-rate-limit
  namespace: devboard
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: devboard-route
  rateLimit:
    local:
      rules:
        - limit:
            requests: 10
            unit: Minute
