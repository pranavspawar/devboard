# This workflow is ( build Already done in dokcer scan) push the docker file 

name : docker-push 
on:
    workflow_call: 
jobs : 
    docker-build-push:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders : ['backend' , 'frontend']
        steps:
            - name : code checkout
              uses: actions/checkout@v7


            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push ${{ matrix.folders }}
              uses: docker/build-push-action@v5
              with:
                context: ./${{ matrix.folders }}
                push: true
                tags: pranavpawar/devboard-${{ matrix.folders }}:latest
